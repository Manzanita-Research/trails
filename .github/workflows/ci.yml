name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: trails-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, test, release audit
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The release audit inspects Bun's compiled-binary format and fails
          # closed on unfamiliar versions, so CI pins the version it was written for.
          bun-version: 1.3.14

      - name: Cache Bun packages
        uses: useblacksmith/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The BB plugin has its own npm lockfile; root typecheck and tests import it.
      - name: Install BB plugin dependencies
        run: npm ci --include=dev
        working-directory: plugins/bb-plugin-trails

      # The private-path checks reject ancestors that are foreign-owned or
      # group/other-writable. Show the runner's state, then make it conform.
      - name: Normalize runner config directory
        run: |
          mkdir -p "$HOME/.config"
          stat -c '%U:%G %a %n' "$HOME" "$HOME/.config"
          sudo chown "$(id -u):$(id -g)" "$HOME/.config"
          chmod 755 "$HOME/.config"
          stat -c '%U:%G %a %n' "$HOME/.config"

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun run test

      - name: Release build and safety check
        run: bun run release:stage
